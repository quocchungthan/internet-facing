# Development sync worker only. It owns neither database nor website; it attaches to two other stacks:
#   - the Farm database, from main:  docker compose -f deployment/local/compose.yml up -d   (network farm-local_default)
#   - the local AFFiNE Docker stack  (network affine_default)
# Run from this directory; DATABASE_CONNECTION_STRING should use Host=postgres (the main stack's service):
#   docker compose -f compose.dev.yml up -d --build
# Production runs the worker as a sidecar of the AFFiNE stack instead (deploy/compose.sync.yml).
services:
  sync:
    build:
      context: ..
      dockerfile: Farm.Sync/Dockerfile
    environment:
      DATABASE_CONNECTION_STRING: ${DATABASE_CONNECTION_STRING:-}
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-60}
      SYNC_STATE_PATH: /state/checkpoint.json
      AFFINE_READER_PATH: /app/reader/export.mjs
      AFFINE_DATABASE_URL: ${AFFINE_DATABASE_URL:-}
      AFFINE_WORKSPACE_ID: ${AFFINE_WORKSPACE_ID:-}
      AFFINE_COLLECTION_ID: ${AFFINE_COLLECTION_ID:-}
      AFFINE_META_DOC_ID: ${AFFINE_META_DOC_ID:-}
      AFFINE_FEEDS_DOC_ID: ${AFFINE_FEEDS_DOC_ID:-}
      AFFINE_FEEDS_BLOCK_ID: ${AFFINE_FEEDS_BLOCK_ID:-}
      AFFINE_PORTFOLIO_COLLECTION_ID: ${AFFINE_PORTFOLIO_COLLECTION_ID:-}
      AFFINE_GIGS_COLLECTION_ID: ${AFFINE_GIGS_COLLECTION_ID:-}
    volumes:
      - sync-state:/state
    healthcheck:
      test: ["CMD", "dotnet", "AffineSync.dll", "--healthcheck"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 120s
    networks:
      - farm-db
      - affine-source
    restart: unless-stopped

volumes:
  sync-state:

networks:
  farm-db:
    external: true
    name: ${FARM_DOCKER_NETWORK:-farm-local_default}
  affine-source:
    external: true
    name: ${AFFINE_DOCKER_NETWORK:-affine_default}
