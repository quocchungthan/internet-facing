# Sidecar for the production AFFiNE stack (note.eldervibe.dev).
# Layered over AFFiNE's selfhost compose.yml, so it shares the compose network and reaches the
# AFFiNE database by its service name (`postgres`):
#
#   docker compose -f compose.yml -f compose.sync.yml up -d affine-sync
#
# Configuration lives in sync.env next to this file on the VPS (never in git). See Farm.Sync/README.md.
services:
  affine-sync:
    image: ${AFFINE_SYNC_IMAGE:-eldervibe-affine-sync:latest}
    pull_policy: never
    env_file:
      - sync.env
    environment:
      SYNC_STATE_PATH: /state/checkpoint.json
      AFFINE_READER_PATH: /app/reader/export.mjs
    networks:
      # The Farm database container (eldervibe-farm-postgres) only publishes on the VPS loopback, so the
      # worker joins the network Farm's deploy script creates and reaches it by container name.
      - default
      - farm-network
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - affine-sync-state:/state
    restart: unless-stopped

networks:
  farm-network:
    external: true
    name: ${FARM_NETWORK:-farm-network}

volumes:
  affine-sync-state:
