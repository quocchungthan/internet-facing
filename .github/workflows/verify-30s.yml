name: 30s feature quality

on:
  push:
    branches: ['feat/30s-*']
  pull_request:
    branches: ['sub/30s']
    paths: ['web/**', '.github/workflows/verify-30s.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 30s-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    # Match the reviewed Windows Chromium/SwiftShader screenshot baselines.
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install chromium
      - run: npm run test:browser -- --reporter=html,line
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 30s-browser-${{ github.sha }}
          path: |
            web/test-results/
            web/playwright-report/
          retention-days: 14
