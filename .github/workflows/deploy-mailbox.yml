name: Deploy MailBox

on:
  push:
    branches:
      - 'sub/mail'
    paths:
      - '.github/workflows/deploy-mailbox.yml'

  workflow_dispatch:
    inputs:
      subdomain:
        description: 'Override the subdomain (only valid on the sub/mail branch)'
        required: false
        type: string
      base_domain:
        description: 'Override the base domain (default: the EV_DOMAIN repository variable)'
        required: false
        type: string
      dry_run:
        description: 'Plan only — run preflight checks and skip the deploy job'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: deploy-mailbox-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight checks
    runs-on: ubuntu-latest
    environment: hostkey-server
    outputs:
      mail_hostname: ${{ steps.derive.outputs.mail_hostname }}
      base_domain: ${{ steps.derive.outputs.base_domain }}
      subdomain: ${{ steps.derive.outputs.subdomain }}
      deploy_dir: ${{ steps.derive.outputs.deploy_dir }}
      ssh_ready: ${{ steps.ssh-check.outputs.ssh_ready }}
      secrets_ok: ${{ steps.secret-check.outputs.secrets_ok }}

    steps:
      - name: Require sub/mail branch
        if: github.ref_name != 'sub/mail'
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "::error::MailBox deploy must run from the 'sub/mail' branch, not '$REF_NAME'."
          echo "::error::Select 'sub/mail' when using workflow_dispatch. Push deploys are only enabled for 'sub/mail'."
          exit 1

      - name: Check out source
        uses: actions/checkout@v4

      - name: Derive domain from branch name
        id: derive
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_SUBDOMAIN: ${{ inputs.subdomain }}
          INPUT_BASE_DOMAIN: ${{ inputs.base_domain }}
          VAR_BASE_DOMAIN: ${{ vars.EV_DOMAIN }}
          VAR_DEPLOY_DIR: ${{ vars.MAILBOX_DEPLOY_DIR }}
        run: |
          set -euo pipefail

          if [[ "$REF_NAME" != "sub/mail" ]]; then
            echo "::error::MailBox deploy must run from the 'sub/mail' branch, not '$REF_NAME'."
            exit 1
          fi

          sub="${INPUT_SUBDOMAIN:-}"
          if [[ -z "$sub" ]]; then
            sub="mail"
          fi

          if [[ ! "$sub" =~ ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$ ]]; then
            echo "::error::Derived subdomain '$sub' is not a valid DNS label."
            echo "::error::Expected lowercase letters, digits and hyphens (1-63 chars, no leading/trailing hyphen)."
            echo "::error::Fix: re-run from the 'sub/mail' branch and pass a valid 'subdomain' input if an override is needed."
            exit 1
          fi

          base="${INPUT_BASE_DOMAIN:-}"
          base="${base:-${VAR_BASE_DOMAIN:-}}"
          if [[ -z "$base" ]]; then
            echo "::error::No base domain is configured — refusing to guess one."
            echo "::error::Fix: create the repository variable EV_DOMAIN (Settings → Secrets and variables →"
            echo "::error::Actions → Variables) with your apex domain, e.g. 'example.dev'."
            echo "::error::Or re-run this workflow via workflow_dispatch and supply the 'base_domain' input."
            exit 1
          fi
          if [[ ! "$base" =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$ ]]; then
            echo "::error::Base domain '$base' is not a valid domain name."
            exit 1
          fi

          deploy_dir="${VAR_DEPLOY_DIR:-}"
          if [[ -z "$deploy_dir" ]]; then
            echo "::error::No deploy directory is configured — refusing to guess one."
            echo "::error::Fix: create the repository variable MAILBOX_DEPLOY_DIR (Settings → Secrets and variables →"
            echo "::error::Actions → Variables) with the absolute path on the VPS, e.g. '/opt/shuneo-mail-mvp'."
            exit 1
          fi
          if [[ "$deploy_dir" != /* ]] || [[ "$deploy_dir" == "/" ]]; then
            echo "::error::Deploy directory '$deploy_dir' must be an absolute path and cannot be '/'."
            exit 1
          fi

          {
            echo "subdomain=$sub"
            echo "base_domain=$base"
            echo "mail_hostname=${sub}.${base}"
            echo "deploy_dir=$deploy_dir"
          } >> "$GITHUB_OUTPUT"

          echo "Branch          : $REF_NAME"
          echo "Subdomain       : $sub"
          echo "Base domain     : $base"
          echo "Mail hostname   : ${sub}.${base}"
          echo "Deploy directory: $deploy_dir"

      - name: Check required GitHub secrets and variables
        id: secret-check
        shell: bash
        env:
          S_VPS_HOST: ${{ secrets.VPS_HOST }}
          S_VPS_USER: ${{ secrets.VPS_USER }}
          S_VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          S_VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          S_ACME_EMAIL: ${{ secrets.ACME_EMAIL }}
          V_ACME_EMAIL: ${{ vars.ACME_EMAIL }}
          S_VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail

          missing=()
          # Values are only tested for emptiness; never printed.
          [[ -n "${S_VPS_HOST:-}" ]]        || missing+=("secret VPS_HOST")
          [[ -n "${S_VPS_USER:-}" ]]        || missing+=("secret VPS_USER")
          [[ -n "${S_VPS_SSH_KEY:-}" ]]     || missing+=("secret VPS_SSH_KEY")
          [[ -n "${S_VPS_KNOWN_HOSTS:-}" ]] || missing+=("secret VPS_KNOWN_HOSTS")
          [[ -n "${S_ACME_EMAIL:-}${V_ACME_EMAIL:-}" ]] || missing+=("variable ACME_EMAIL or secret ACME_EMAIL")

          optional=()
          [[ -n "${S_VPS_PORT:-}" ]] || optional+=("secret VPS_PORT (defaults to 22)")

          {
            echo "## MailBox deploy — preflight report"
            echo
            echo "### 1. GitHub secrets / variables"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ ${#missing[@]} -eq 0 ]]; then
            echo "secrets_ok=true" >> "$GITHUB_OUTPUT"
            echo "- PASS — all required secrets are present." >> "$GITHUB_STEP_SUMMARY"
            echo "PASS: all required secrets are present."
          else
            echo "secrets_ok=false" >> "$GITHUB_OUTPUT"
            echo "- FAIL — the following are MISSING and must be created in repository settings:" >> "$GITHUB_STEP_SUMMARY"
            for item in "${missing[@]}"; do
              echo "  - \`$item\`" >> "$GITHUB_STEP_SUMMARY"
              echo "MISSING: $item"
            done
          fi

          if [[ ${#optional[@]} -gt 0 ]]; then
            echo "- NOTE — optional settings not configured:" >> "$GITHUB_STEP_SUMMARY"
            for item in "${optional[@]}"; do
              echo "  - \`$item\`" >> "$GITHUB_STEP_SUMMARY"
            done
          fi
          echo >> "$GITHUB_STEP_SUMMARY"

      - name: Verify shared design assets can be staged
        shell: bash
        run: |
          set -euo pipefail
          # Fails loudly here (including on dry_run) rather than during the VPS image build.
          python3 MailBox/scripts/stage-shared-assets.py
          python3 MailBox/scripts/stage-shared-assets.py --check

      - name: Check DNS preconditions
        id: dns-check
        shell: bash
        env:
          MAIL_HOSTNAME: ${{ steps.derive.outputs.mail_hostname }}
          BASE_DOMAIN: ${{ steps.derive.outputs.base_domain }}
        run: |
          set -euo pipefail

          if ! command -v dig >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq dnsutils >/dev/null
          fi

          summary() { echo "$1" >> "$GITHUB_STEP_SUMMARY"; }

          summary "### 2. DNS records for \`$MAIL_HOSTNAME\`"
          summary ""
          summary "| Check | Result | Observed | Required value if missing |"
          summary "|---|---|---|---|"

          a_record="$(dig +short A "$MAIL_HOSTNAME" | tail -n1 || true)"
          if [[ -n "$a_record" ]]; then
            summary "| A \`$MAIL_HOSTNAME\` | PASS | \`$a_record\` | — |"
          else
            summary "| A \`$MAIL_HOSTNAME\` | FAIL | (none) | \`A  ${MAIL_HOSTNAME%%.*}  <VPS_IPv4>\` — Cloudflare: DNS only (grey cloud) |"
          fi

          vps_ip="$a_record"
          echo "resolved_ip=$vps_ip" >> "$GITHUB_OUTPUT"

          mx_record="$(dig +short MX "$BASE_DOMAIN" | tr -d '\r' | paste -sd'; ' - || true)"
          if echo "$mx_record" | grep -qi "$MAIL_HOSTNAME"; then
            summary "| MX \`$BASE_DOMAIN\` | PASS | \`$mx_record\` | — |"
          else
            summary "| MX \`$BASE_DOMAIN\` | FAIL | \`${mx_record:-(none)}\` | \`MX  @  10 ${MAIL_HOSTNAME}.\` |"
          fi

          if [[ -n "$vps_ip" ]]; then
            ptr="$(dig +short -x "$vps_ip" | tr -d '\r' | paste -sd'; ' - || true)"
            if echo "$ptr" | grep -qi "$MAIL_HOSTNAME"; then
              summary "| PTR \`$vps_ip\` | PASS | \`$ptr\` | — |"
            else
              summary "| PTR \`$vps_ip\` | FAIL | \`${ptr:-(none)}\` | \`$vps_ip -> $MAIL_HOSTNAME\` — set by the VPS provider only |"
            fi
          else
            summary "| PTR | SKIP | no IP known | create the A record first |"
          fi

          spf="$(dig +short TXT "$BASE_DOMAIN" | tr -d '"' | grep -i 'v=spf1' | paste -sd'; ' - || true)"
          if [[ -n "$spf" ]]; then
            summary "| SPF TXT \`$BASE_DOMAIN\` | PASS | \`$spf\` | — |"
          else
            summary "| SPF TXT \`$BASE_DOMAIN\` | FAIL | (none) | \`TXT  @  v=spf1 ip4:${vps_ip:-<VPS_IPv4>} -all\` — exactly one SPF record |"
          fi

          dmarc="$(dig +short TXT "_dmarc.$BASE_DOMAIN" | tr -d '"' | grep -i 'v=DMARC1' | paste -sd'; ' - || true)"
          if [[ -n "$dmarc" ]]; then
            summary "| DMARC TXT \`_dmarc.$BASE_DOMAIN\` | PASS | \`$dmarc\` | — |"
          else
            summary "| DMARC TXT \`_dmarc.$BASE_DOMAIN\` | FAIL | (none) | \`TXT  _dmarc  v=DMARC1; p=none; rua=mailto:admin@$BASE_DOMAIN\` |"
          fi

          dkim="$(dig +short TXT "default._domainkey.$BASE_DOMAIN" | tr -d '"' | grep -i 'v=DKIM1' | cut -c1-60 || true)"
          if [[ -n "$dkim" ]]; then
            summary "| DKIM TXT \`default._domainkey.$BASE_DOMAIN\` | PASS | \`${dkim}...\` | — |"
          else
            summary "| DKIM TXT \`default._domainkey.$BASE_DOMAIN\` | FAIL | (none) | value is generated by Maddy — see ACTION REQUIRED below |"
          fi
          summary ""

      - name: Check port reachability
        shell: bash
        env:
          MAIL_HOSTNAME: ${{ steps.derive.outputs.mail_hostname }}
          TARGET_IP: ${{ steps.dns-check.outputs.resolved_ip }}
        run: |
          set -euo pipefail

          summary() { echo "$1" >> "$GITHUB_STEP_SUMMARY"; }

          summary "### 3. Port reachability from the GitHub runner"
          summary ""

          target="${TARGET_IP:-}"
          if [[ -z "$target" ]]; then
            summary "SKIP — no IP resolved for \`$MAIL_HOSTNAME\`."
            summary ""
            exit 0
          fi

          summary "| Port | Purpose | Result |"
          summary "|---|---|---|"
          check_port() {
            local port="$1" purpose="$2"
            if nc -z -w 6 "$target" "$port" >/dev/null 2>&1; then
              summary "| $port | $purpose | OPEN |"
            elif [[ "$port" == "25" ]]; then
              summary "| 25 | $purpose | INCONCLUSIVE — GitHub-hosted runners block outbound TCP 25; test from elsewhere |"
            else
              summary "| $port | $purpose | CLOSED / filtered |"
            fi
          }
          check_port 25 "inbound SMTP"
          check_port 587 "submission (STARTTLS)"
          check_port 993 "IMAP over TLS"
          check_port 80 "HTTP / ACME challenge"
          check_port 443 "webmail HTTPS"
          summary ""

      - name: Set up SSH
        id: ssh-setup
        if: steps.secret-check.outputs.secrets_ok == 'true'
        shell: bash
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Check VPS reachability and prerequisites
        id: ssh-check
        if: steps.secret-check.outputs.secrets_ok == 'true'
        continue-on-error: true
        shell: bash
        env:
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER }}
          SSH_PORT: ${{ secrets.VPS_PORT || '22' }}
          DEPLOY_DIR: ${{ steps.derive.outputs.deploy_dir }}
          MAIL_HOSTNAME: ${{ steps.derive.outputs.mail_hostname }}
        run: |
          set -euo pipefail

          port="${SSH_PORT:-22}"
          ssh_opts=(-i ~/.ssh/id_deploy -p "$port" -o BatchMode=yes -o ConnectTimeout=15)

          summary() { echo "$1" >> "$GITHUB_STEP_SUMMARY"; }
          summary "### 4. VPS state"
          summary ""

          if ! report="$(ssh "${ssh_opts[@]}" "$SSH_USER@$SSH_HOST" \
          "DEPLOY_DIR='$DEPLOY_DIR' MAIL_HOSTNAME='$MAIL_HOSTNAME' bash -s" <<'REMOTE'
          set -uo pipefail
          echo "ssh=OK"
          docker_state=MISSING
          compose_state=MISSING
          deploy_dir_state=MISSING
          env_file_state=MISSING
          accounts_state=MISSING
          command -v docker >/dev/null 2>&1 && docker_state="OK ($(docker --version 2>/dev/null))"
          docker compose version >/dev/null 2>&1 && compose_state="OK ($(docker compose version --short 2>/dev/null))"
          [ -d "$DEPLOY_DIR" ] && deploy_dir_state=OK
          [ -f "$DEPLOY_DIR/.env" ] && env_file_state=OK
          [ -f "$DEPLOY_DIR/secrets/accounts.json" ] && accounts_state=OK
          echo "docker=$docker_state"
          echo "compose=$compose_state"
          echo "deploy_dir=$deploy_dir_state"
          echo "env_file=$env_file_state"
          echo "accounts=$accounts_state"

          cert_dir="$DEPLOY_DIR/runtime/letsencrypt/live/$MAIL_HOSTNAME"
          cert="$cert_dir/fullchain.pem"
          key="$cert_dir/privkey.pem"
          cert_status() {
            if [ -s "$cert" ] && [ -s "$key" ]; then
              expiry=$(openssl x509 -enddate -noout -in "$cert" 2>/dev/null | cut -d= -f2)
              echo "cert=OK (expires ${expiry:-unknown})"
              return 0
            fi
            [ "${1:-}" = quiet ] && return 1
            echo "cert=MISSING"
            echo "cert_note=will be generated after source upload in deploy job"
            return 1
          }

          cert_status || true
          exit 0
          REMOTE
          )"; then
            echo "ssh_ready=false" >> "$GITHUB_OUTPUT"
            summary "- FAIL — cannot reach the VPS over SSH."
            summary "  - Verify \`VPS_HOST\`, \`VPS_USER\`, \`VPS_SSH_KEY\` and \`VPS_KNOWN_HOSTS\` in the \`hostkey-server\` environment."
            summary "  - Regenerate known_hosts with \`ssh-keyscan -p <port> <host>\` and paste the output into the secret."
            summary ""
            exit 0
          fi

          echo "$report"
          summary '```text'
          summary "$report"
          summary '```'

          blocking=0
          grep -q '^docker=OK' <<<"$report"     || { summary "- FAIL — Docker Engine is not installed (README section 1.5)."; blocking=1; }
          grep -q '^compose=OK' <<<"$report"    || { summary "- FAIL — Docker Compose v2 is not available (\`docker compose version\`)."; blocking=1; }
          grep -q '^deploy_dir=OK' <<<"$report" || { summary "- FAIL — \`$DEPLOY_DIR\` does not exist on the VPS."; blocking=1; }
          grep -q '^env_file=OK' <<<"$report"   || { summary "- FAIL — \`.env\` is missing: run \`manage.py init\` manually (README section 3)."; blocking=1; }
          grep -q '^accounts=OK' <<<"$report"   || { summary "- FAIL — \`secrets/accounts.json\` is missing: run \`manage.py init\` manually (README section 3)."; blocking=1; }
          if grep -q '^cert=MISSING' <<<"$report"; then
            summary "- NOTE — no TLS certificate for \`$MAIL_HOSTNAME\` yet. This is not a blocking preflight failure; the deploy job generates it after uploading MailBox source."
          fi

          summary ""
          if [[ "$blocking" -eq 0 ]]; then
            echo "ssh_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ssh_ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Emit ACTION REQUIRED report
        if: always()
        shell: bash
        env:
          MAIL_HOSTNAME: ${{ steps.derive.outputs.mail_hostname }}
          BASE_DOMAIN: ${{ steps.derive.outputs.base_domain }}
          DEPLOY_DIR: ${{ steps.derive.outputs.deploy_dir }}
          VPS_IP: ${{ steps.dns-check.outputs.resolved_ip }}
        run: |
          set -euo pipefail
          ip="${VPS_IP:-<VPS_IPv4>}"
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ---

          ## ACTION REQUIRED — do this manually

          These steps cannot be automated by this workflow. Nothing below is performed by CI.

          **A. VPS provider (ticket + control panel)**
          1. Ask the provider to unblock **inbound and outbound TCP 25**. An in-VM firewall rule cannot lift this.
          2. Ask the provider to set **PTR / rDNS**: \`$ip -> $MAIL_HOSTNAME\`.
          3. Open inbound TCP **25, 587, 993, 80, 443** in the provider network firewall / security group.
          4. On the VPS, verify Docker traffic is not dropped by \`DOCKER-USER\`:
             \`sudo iptables -L DOCKER-USER -n -v --line-numbers\` (MANUAL_PIGGY_FARM section 9).

          **B. DNS provider**
          | Type | Name | Value |
          |---|---|---|
          | A | \`${MAIL_HOSTNAME%%.*}\` | \`$ip\` (Cloudflare: DNS only / grey cloud) |
          | MX | \`@\` | priority \`10\`, \`$MAIL_HOSTNAME\` |
          | TXT | \`@\` | \`v=spf1 ip4:$ip -all\` (only one SPF record) |
          | TXT | \`_dmarc\` | \`v=DMARC1; p=none; rua=mailto:admin@$BASE_DOMAIN\` |
          | TXT | \`default._domainkey\` | value printed by Maddy — see step C4 |

          **C. One-time bootstrap on the VPS (README sections 3-7)**
          Run these yourself in \`$DEPLOY_DIR\`. The deploy job refuses to run init/accounts because
          re-running them can overwrite existing credentials and mail data. Certificate generation is automated when
          MailBox source has been uploaded, so \`cert=MISSING\` in preflight is not fatal. DNS and port 80 must be
          ready before the deploy job can issue the certificate; manual fallback is shown below if Let's Encrypt fails.
          \`\`\`bash
          cd $DEPLOY_DIR
          python3 scripts/manage.py init --domain $BASE_DOMAIN --hostname $MAIL_HOSTNAME
          # Optional fallback only: python3 scripts/manage.py certificate --email <an-existing-mailbox>
          docker compose up -d --build
          python3 scripts/manage.py accounts
          docker compose exec maddy sh -c 'cat /data/dkim_keys/*.dns'   # C4: copy the TXT record into DNS
          \`\`\`
          Passwords live in \`$DEPLOY_DIR/secrets/accounts.json\` (mode 0600). Never commit or upload it.

          **D. Recurring operations (not run by CI)**
          - Certificate renewal cron as root (README section 9):
            \`17 3 * * * cd $DEPLOY_DIR && /usr/bin/python3 scripts/manage.py renew >> /var/log/shuneo-mail-renew.log 2>&1\`
          - Backups (README section 10): \`python3 scripts/manage.py backup\`, then copy the archive off the VPS.
          - Deliverability check: send to/from Gmail and confirm SPF, DKIM and DMARC PASS in *Show original*.

          **E. Never touched by this workflow**
          \`.env\`, \`secrets/\`, \`runtime/\` and \`backups/\` on the VPS are excluded from every upload.
          EOF

      - name: Fail if preflight is blocking
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          SECRETS_OK: ${{ steps.secret-check.outputs.secrets_ok }}
          SSH_READY: ${{ steps.ssh-check.outputs.ssh_ready }}
        run: |
          set -euo pipefail
          if [[ "${SECRETS_OK:-false}" != "true" || "${SSH_READY:-false}" != "true" ]]; then
            echo "::error::Preflight failed. Read the 'ACTION REQUIRED' block in the job summary, fix the reported items, then re-run."
            exit 1
          fi
          echo "Preflight passed."

  deploy:
    name: Deploy to VPS
    needs: preflight
    if: ${{ !inputs.dry_run && needs.preflight.outputs.ssh_ready == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: hostkey-server
      url: https://${{ needs.preflight.outputs.mail_hostname }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up SSH
        shell: bash
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Verify runtime state still exists on the VPS
        shell: bash
        env:
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER }}
          SSH_PORT: ${{ secrets.VPS_PORT || '22' }}
          DEPLOY_DIR: ${{ needs.preflight.outputs.deploy_dir }}
          MAIL_HOSTNAME: ${{ needs.preflight.outputs.mail_hostname }}
        run: |
          set -euo pipefail
          port="${SSH_PORT:-22}"
          ssh -i ~/.ssh/id_deploy -p "$port" -o BatchMode=yes -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" "DEPLOY_DIR='$DEPLOY_DIR' bash -s" <<'REMOTE'
          set -euo pipefail

          env_file="$DEPLOY_DIR/.env"
          secrets_dir="$DEPLOY_DIR/secrets"
          accounts_file="$secrets_dir/accounts.json"
          missing=()

          echo "deploy_dir=$DEPLOY_DIR"
          if [ -d "$DEPLOY_DIR" ]; then
            echo "deploy_dir_exists=yes"
            ls -ld "$DEPLOY_DIR"
          else
            echo "deploy_dir_exists=no"
          fi

          if [ -f "$env_file" ]; then
            echo "env_file_exists=yes ($env_file)"
          else
            echo "env_file_exists=no ($env_file)"
            missing+=("$env_file")
          fi

          if [ -d "$secrets_dir" ]; then
            echo "secrets_dir_exists=yes ($secrets_dir)"
            ls -ld "$secrets_dir"
          else
            echo "secrets_dir_exists=no ($secrets_dir)"
          fi

          if [ -f "$accounts_file" ]; then
            echo "accounts_file_exists=yes ($accounts_file)"
          else
            echo "accounts_file_exists=no ($accounts_file)"
            missing+=("$accounts_file")
          fi

          if [ "${#missing[@]}" -gt 0 ]; then
            for path in "${missing[@]}"; do
              echo "::error::Missing required runtime file on the VPS: $path" >&2
            done
            echo "::error::Stopping before any upload. MAILBOX_DEPLOY_DIR in the hostkey-server environment must match the directory where init was run." >&2
            echo "::error::This workflow excludes .env and secrets/ from uploads and never creates or resets credentials." >&2
            exit 1
          fi
          REMOTE

      - name: Stage shared design assets into the MailBox payload
        shell: bash
        run: |
          set -euo pipefail
          # Farm/ is never uploaded, so the shared tokens and favicon must be copied into
          # MailBox/web/static before the rsync below; the image build on the VPS fails
          # without them.
          python3 MailBox/scripts/stage-shared-assets.py
          python3 MailBox/scripts/stage-shared-assets.py --check
          ls -l MailBox/web/static/shared/variables.css \
                MailBox/web/static/shared/base.css \
                MailBox/web/static/favicon.ico

      - name: Upload MailBox source (excludes .env, secrets, runtime, backups)
        shell: bash
        env:
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER }}
          SSH_PORT: ${{ secrets.VPS_PORT || '22' }}
          DEPLOY_DIR: ${{ needs.preflight.outputs.deploy_dir }}
        run: |
          set -euo pipefail
          port="${SSH_PORT:-22}"
          rsync -az --delete \
            --exclude '.env' \
            --exclude 'secrets/' \
            --exclude 'runtime/' \
            --exclude 'backups/' \
            --exclude 'dist/' \
            --exclude '.git/' \
            --exclude '__pycache__/' \
            --exclude '.pytest_cache/' \
            -e "ssh -i $HOME/.ssh/id_deploy -p $port -o BatchMode=yes -o ConnectTimeout=15" \
            MailBox/ "$SSH_USER@$SSH_HOST:$DEPLOY_DIR/"

      - name: Ensure TLS certificate exists
        shell: bash
        env:
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER }}
          SSH_PORT: ${{ secrets.VPS_PORT || '22' }}
          DEPLOY_DIR: ${{ needs.preflight.outputs.deploy_dir }}
          MAIL_HOSTNAME: ${{ needs.preflight.outputs.mail_hostname }}
          ACME_EMAIL: ${{ secrets.ACME_EMAIL || vars.ACME_EMAIL }}
        run: |
          set -euo pipefail
          port="${SSH_PORT:-22}"
          acme_email_b64="$(printf '%s' "$ACME_EMAIL" | base64 -w0)"
          ssh -i ~/.ssh/id_deploy -p "$port" -o BatchMode=yes -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" "DEPLOY_DIR='$DEPLOY_DIR' MAIL_HOSTNAME='$MAIL_HOSTNAME' ACME_EMAIL_B64='$acme_email_b64' bash -s" <<'REMOTE'
          set -euo pipefail
          ACME_EMAIL="$(printf '%s' "$ACME_EMAIL_B64" | base64 -d 2>/dev/null || true)"
          cert_dir="$DEPLOY_DIR/runtime/letsencrypt/live/$MAIL_HOSTNAME"
          cert="$cert_dir/fullchain.pem"
          key="$cert_dir/privkey.pem"

          if [ -s "$cert" ] && [ -s "$key" ]; then
            echo "TLS certificate already exists for $MAIL_HOSTNAME."
            exit 0
          fi

          if [ -z "$ACME_EMAIL" ]; then
            echo "ACME_EMAIL is required to issue the TLS certificate."
            exit 1
          fi

          cd "$DEPLOY_DIR"
          echo "TLS certificate missing for $MAIL_HOSTNAME; starting Let's Encrypt issuance."
          cert_log="$(mktemp)"
          if python3 scripts/manage.py certificate --email "$ACME_EMAIL" >"$cert_log" 2>&1; then
            rm -f "$cert_log"
          else
            exit_code=$?
            sed -E 's/[[:alnum:]._%+-]+@[[:alnum:].-]+\.[[:alpha:]]{2,}/<redacted-email>/g' "$cert_log" | tail -n 40
            rm -f "$cert_log"
            exit "$exit_code"
          fi

          if [ ! -s "$cert" ] || [ ! -s "$key" ]; then
            echo "Certificate command completed but expected certificate files are still missing."
            exit 1
          fi
          echo "TLS certificate ready for $MAIL_HOSTNAME."
          REMOTE

      - name: Build and start services
        shell: bash
        env:
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER }}
          SSH_PORT: ${{ secrets.VPS_PORT || '22' }}
          DEPLOY_DIR: ${{ needs.preflight.outputs.deploy_dir }}
          MAIL_HOSTNAME: ${{ needs.preflight.outputs.mail_hostname }}
        run: |
          set -euo pipefail
          port="${SSH_PORT:-22}"
          ssh -i ~/.ssh/id_deploy -p "$port" -o BatchMode=yes -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" "DEPLOY_DIR='$DEPLOY_DIR' MAIL_HOSTNAME='$MAIL_HOSTNAME' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_DIR"
          docker compose up -d --build
          MAIL_HOSTNAME="$MAIL_HOSTNAME" MAIL_DEPLOY_DIR="$DEPLOY_DIR" bash scripts/configure-caddy-web.sh
          docker compose ps
          REMOTE

      - name: Post-deploy health check
        shell: bash
        env:
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER }}
          SSH_PORT: ${{ secrets.VPS_PORT || '22' }}
          DEPLOY_DIR: ${{ needs.preflight.outputs.deploy_dir }}
          MAIL_HOSTNAME: ${{ needs.preflight.outputs.mail_hostname }}
        run: |
          set -euo pipefail
          port="${SSH_PORT:-22}"

          states="$(ssh -i ~/.ssh/id_deploy -p "$port" -o BatchMode=yes -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" "cd '$DEPLOY_DIR' && docker compose ps --format '{{.Service}} {{.State}}'")"
          echo "$states"

          failed=0
          for svc in maddy web; do
            if ! grep -Eq "^$svc (running|Up)" <<<"$states"; then
              echo "::error::Service '$svc' is not running after deploy."
              failed=1
            fi
          done

          public_curl_stderr="$(mktemp)"
          public_curl_exit=0
          code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "https://$MAIL_HOSTNAME/" 2>"$public_curl_stderr")" || public_curl_exit=$?
          public_curl_error="$(tr '\r\n' ' ' < "$public_curl_stderr" | cut -c1-240 || true)"
          rm -f "$public_curl_stderr"
          if [[ "$public_curl_exit" -ne 0 ]]; then
            code=000
          fi

          echo "HTTPS https://$MAIL_HOSTNAME/ -> $code"
          if [[ "$public_curl_exit" -ne 0 ]]; then
            echo "Public HTTPS curl exit code: $public_curl_exit"
            if [[ -n "$public_curl_error" ]]; then
              echo "Public HTTPS curl error: $public_curl_error"
            fi
          fi

          diagnostics=""
          failure_note=""
          if [[ ! "$code" =~ ^(200|301|302|303)$ ]]; then
            echo "::error::HTTPS health check for $MAIL_HOSTNAME returned $code."
            if diagnostics="$(ssh -i ~/.ssh/id_deploy -p "$port" -o BatchMode=yes -o ConnectTimeout=15 \
              "$SSH_USER@$SSH_HOST" "DEPLOY_DIR='$DEPLOY_DIR' MAIL_HOSTNAME='$MAIL_HOSTNAME' bash -s" <<'REMOTE'
          set -uo pipefail

          cd "$DEPLOY_DIR" 2>/dev/null || true

          curl_status() {
            name="$1"
            shift
            stderr_file="$(mktemp)"
            exit_code=0
            status="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$@" 2>"$stderr_file")" || exit_code=$?
            error_text="$(tr '\r\n' ' ' < "$stderr_file" | cut -c1-240 || true)"
            rm -f "$stderr_file"
            if [ "$exit_code" -ne 0 ]; then
              status=000
            fi
            echo "${name}_code=$status"
            echo "${name}_exit=$exit_code"
            if [ -n "$error_text" ]; then
              echo "${name}_error=$error_text"
            fi
          }

          echo "### Remote HTTP checks"
          curl_status local_https -k --resolve "$MAIL_HOSTNAME:443:127.0.0.1" "https://$MAIL_HOSTNAME/"
          curl_status local_web "http://127.0.0.1:8000/"

          echo
          echo "### Caddy state"
          if command -v systemctl >/dev/null 2>&1; then
            systemctl is-active caddy 2>&1 || true
          else
            echo "systemctl unavailable"
          fi

          if command -v caddy >/dev/null 2>&1; then
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile 2>&1 || true
          else
            echo "caddy command unavailable"
          fi

          echo
          echo "### Listening ports"
          if command -v ss >/dev/null 2>&1; then
            ss -lntp 2>/dev/null | awk 'NR == 1 || /:(80|443|8000)([[:space:]]|$)/' || \
              ss -lnt 2>/dev/null | awk 'NR == 1 || /:(80|443|8000)([[:space:]]|$)/' || true
          else
            echo "ss unavailable"
          fi

          echo
          echo "### Recent Caddy journal"
          if command -v journalctl >/dev/null 2>&1; then
            journalctl -u caddy --no-pager -n 80 2>&1 || true
          else
            echo "journalctl unavailable"
          fi

          echo
          echo "### Docker compose logs: web"
          docker compose logs --tail=120 web 2>&1 || true

          echo
          echo "### Docker compose logs: maddy"
          docker compose logs --tail=80 maddy 2>&1 || true
          REMOTE
            )"; then
              echo "$diagnostics"
              local_https_code="$(grep -E '^local_https_code=' <<<"$diagnostics" | tail -n1 | cut -d= -f2- || true)"
              if [[ "$local_https_code" =~ ^(200|301|302|303)$ ]]; then
                failure_note="Local Caddy route succeeded on the VPS while public HTTPS failed; likely causes are DNS, provider firewall/security-group rules, or an external proxy path."
                echo "::notice::$failure_note"
              fi
            else
              echo "::warning::Could not collect remote HTTPS failure diagnostics over SSH."
            fi
            failed=1
          fi

          {
            echo "## Deploy result"
            echo
            echo '```text'
            echo "$states"
            echo "https://$MAIL_HOSTNAME/ -> $code"
            if [[ "$public_curl_exit" -ne 0 ]]; then
              echo "public curl exit: $public_curl_exit"
              if [[ -n "$public_curl_error" ]]; then
                echo "public curl error: $public_curl_error"
              fi
            fi
            if [[ -n "$diagnostics" ]]; then
              echo
              echo "$diagnostics"
            fi
            if [[ -n "$failure_note" ]]; then
              echo
              echo "$failure_note"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$failed" -ne 0 ]]; then
            echo "::error::Post-deploy health check failed. See the remote diagnostics above."
            exit 1
          fi
