name: Deploy Storage

on:
  ## Do not auto-deploy for now
  # push:
  #   branches:
  #     - sub/storage
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-storage-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: hostkey-server

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VPS_KNOWN_HOSTS"
          test -n "$VPS_SSH_KEY"
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          eval "$(ssh-agent -s)"
          ssh-add - <<< "$VPS_SSH_KEY"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"

      - name: Resolve storage deploy directory
        env:
          VAR_DEPLOY_DIR: ${{ vars.STORAGE_DEPLOY_DIR }}
        run: |
          set -euo pipefail
          if [[ -z "${VAR_DEPLOY_DIR:-}" ]]; then
            echo "::error::Repository variable STORAGE_DEPLOY_DIR is required in hostkey-server."
            exit 1
          fi
          if [[ "$VAR_DEPLOY_DIR" != /* ]] || [[ "$VAR_DEPLOY_DIR" == "/" ]]; then
            echo "::error::STORAGE_DEPLOY_DIR must be an absolute path and cannot be '/'."
            exit 1
          fi
          echo "STORAGE_DEPLOY_DIR=$VAR_DEPLOY_DIR" >> "$GITHUB_ENV"

      - name: Transfer Seafile Storage files
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          STORAGE_DEPLOY_DIR: ${{ vars.STORAGE_DEPLOY_DIR }}
        run: |
          set -euo pipefail
          tar -C Shed -czf - . | ssh \
            -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            'rm -rf /tmp/storage-deploy && mkdir -p /tmp/storage-deploy && tar -xzf - -C /tmp/storage-deploy'

      - name: Deploy Seafile behind Caddy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          STORAGE_DEPLOY_DIR: ${{ vars.STORAGE_DEPLOY_DIR }}
        run: |
          set -euo pipefail
          ssh \
            -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "STORAGE_SOURCE_DIR=/tmp/storage-deploy STORAGE_DEPLOY_DIR='$STORAGE_DEPLOY_DIR' bash -s" \
            < Shed/deployment/deploy-storage.sh
