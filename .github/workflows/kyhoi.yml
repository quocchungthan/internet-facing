name: Kỳ Hội validation

on:
  pull_request:
    paths:
      - 'KyHoi/**'
      - '.github/workflows/kyhoi.yml'
  push:
    branches: [main, 'codex/kyhoi-ip-rooms']
    paths:
      - 'KyHoi/**'
      - '.github/workflows/kyhoi.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: KyHoi/Projects/TikTok-Live-Turnbased/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: KyHoi/Projects/TikTok-Live-Turnbased/app/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Check deployment scripts
        working-directory: .
        run: |
          bash -n KyHoi/deployment/deploy.sh KyHoi/deployment/test-image.sh
          shellcheck KyHoi/deployment/deploy.sh KyHoi/deployment/test-image.sh
      - name: Build and smoke test production image
        working-directory: .
        run: |
          docker build -t kyhoi:${{ github.sha }} -f KyHoi/Dockerfile KyHoi
          bash KyHoi/deployment/test-image.sh kyhoi:${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kyhoi-browser-verification
          path: KyHoi/Projects/TikTok-Live-Turnbased/verification/
