name: Deploy Storage

on:
  ## should not autodeploy for now
  # push:
  #   branches:
  #     - sub/storage
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/reusable-deploy-service.yml
    with:
      image_name: ghcr.io/${{ github.repository_owner }}/internet-facing-storage
      image_tag: ${{ github.sha }}
      docker_context: Shed
      dockerfile: Shed/Shed/Dockerfile
      wrapper_path: Shed/deployment/deploy-shed.sh
      deploy_common_script: deployment/deploy-caddy-service.sh
      runtime_image_argument: STORAGE_IMAGE
    secrets:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      ACME_EMAIL: ${{ secrets.ACME_EMAIL || vars.ACME_EMAIL }}
