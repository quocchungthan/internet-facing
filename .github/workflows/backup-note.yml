name: Backup Note

on:
  workflow_dispatch:
  ## Daily backup; comment out to disable scheduled runs
  # schedule:
  #   - cron: '0 3 * * *'

permissions:
  contents: read

concurrency:
  group: backup-note-production
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    environment: hostkey-server

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve AFFiNE deploy dir
        shell: bash
        env:
          VAR_DEPLOY_DIR: ${{ vars.AFFINE_DEPLOY_DIR }}
        run: |
          set -euo pipefail
          if [[ -z "${VAR_DEPLOY_DIR:-}" ]]; then
            echo "::error::Repository variable AFFINE_DEPLOY_DIR is required. Create it under Settings → Secrets and variables → Actions → Variables."
            exit 1
          fi
          if [[ "$VAR_DEPLOY_DIR" != /* ]] || [[ "$VAR_DEPLOY_DIR" == "/" ]]; then
            echo "::error::AFFINE_DEPLOY_DIR must be an absolute path and cannot be '/'."
            exit 1
          fi
          echo "AFFINE_DEPLOY_DIR=$VAR_DEPLOY_DIR" >> "$GITHUB_ENV"

      - name: Configure SSH
        env:
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VPS_KNOWN_HOSTS"
          test -n "$VPS_SSH_KEY"
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          eval "$(ssh-agent -s)"
          ssh-add - <<< "$VPS_SSH_KEY"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"

      - name: Run backup on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          AFFINE_DEPLOY_DIR: ${{ vars.AFFINE_DEPLOY_DIR }}
        run: |
          set -euo pipefail
          ssh \
            -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "AFFINE_DEPLOY_DIR='$AFFINE_DEPLOY_DIR' AFFINE_BACKUP_KEEP='7' bash -s" \
            < Streams/BackupNote.sh | tee backup_output.log

          archive_path="$(grep '^AFFINE_BACKUP_ARCHIVE=' backup_output.log | cut -d= -f2-)"
          echo "Backup archive stays on VPS: $archive_path"
          ssh \
            -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "du -h '$archive_path'"
