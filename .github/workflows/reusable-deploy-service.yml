name: Reusable service deployment

on:
  workflow_call:
    inputs:
      image_name:
        description: Docker image name to build and transfer
        required: true
        type: string
      image_tag:
        description: Docker image tag to build and transfer
        required: true
        type: string
      docker_context:
        description: Docker build context
        required: true
        type: string
      dockerfile:
        description: Dockerfile path relative to the repository
        required: true
        type: string
      wrapper_path:
        description: Service deployment wrapper path
        required: true
        type: string
      deploy_common_script:
        description: Shared ingress deployment script path
        required: true
        type: string
      runtime_image_argument:
        description: Environment variable name consumed by the service wrapper
        required: true
        type: string
      image_artifact:
        description: Optional workflow artifact containing a gzip-compressed Docker image tarball
        required: false
        type: string
        default: ''
    secrets:
      VPS_HOST:
        required: true
      VPS_PORT:
        required: true
      VPS_USER:
        required: true
      VPS_SSH_KEY:
        required: true
      VPS_KNOWN_HOSTS:
        required: true
      ACME_EMAIL:
        required: false

permissions:
  contents: read

concurrency:
  group: deploy-service-${{ inputs.image_name }}-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: hostkey-server

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download prebuilt service image
        if: inputs.image_artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.image_artifact }}
          path: ${{ runner.temp }}/service-image

      - name: Load prebuilt service image
        if: inputs.image_artifact != ''
        run: |
          set -euo pipefail
          image_archive="${{ runner.temp }}/service-image/image.tar.gz"
          test -s "$image_archive"
          gzip --decompress --stdout "$image_archive" | docker load

      - name: Build service image
        if: inputs.image_artifact == ''
        run: docker build --pull --tag "${{ inputs.image_name }}:${{ inputs.image_tag }}" --file "${{ inputs.dockerfile }}" "${{ inputs.docker_context }}"

      - name: Configure SSH host verification
        env:
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$VPS_KNOWN_HOSTS"
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Load SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VPS_SSH_KEY"
          eval "$(ssh-agent -s)"
          ssh-add - <<< "$VPS_SSH_KEY"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

      - name: Transfer image to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_PORT"
          test -n "$VPS_USER"
          docker save "${{ inputs.image_name }}:${{ inputs.image_tag }}" | gzip | ssh \
            -p "$VPS_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            'if docker info >/dev/null 2>&1; then exec docker load; fi
             if ! command -v sudo >/dev/null 2>&1 || ! sudo -n -l >/dev/null 2>&1; then
               echo "Docker is unavailable to VPS_USER and passwordless sudo is not configured." >&2
               exit 1
             fi
             exec sudo -n docker load'

      - name: Transfer common script and invoke service wrapper
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          ACME_EMAIL: ${{ secrets.ACME_EMAIL || vars.ACME_EMAIL }}
        run: |
          set -euo pipefail
          common_script=/tmp/deploy-common.sh
          wrapper_script=/tmp/deploy-service-wrapper.sh
          ssh \
            -p "$VPS_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "cat > '$common_script' && chmod 700 '$common_script'" \
            < "${{ inputs.deploy_common_script }}"
          printf 'export ACME_EMAIL=%q\n' "$ACME_EMAIL" > /tmp/deploy-service-wrapper.local.sh
          cat "${{ inputs.wrapper_path }}" >> /tmp/deploy-service-wrapper.local.sh
          # Transfer the wrapper as a real file (same as the common script above) rather than
          # piping it through `bash -s`. The wrapper ends with `exec bash "$DEPLOY_COMMON_SCRIPT"`,
          # which replaces the running process while its stdin is still attached to this SSH
          # channel; running the wrapper from a file instead of a stdin-fed `bash -s` removes any
          # dependency on that pipe's buffering/EOF timing at the moment of exec.
          ssh \
            -p "$VPS_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "cat > '$wrapper_script' && chmod 700 '$wrapper_script'" \
            < /tmp/deploy-service-wrapper.local.sh
          ssh \
            -p "$VPS_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "trap 'rm -f $common_script $wrapper_script' EXIT; DEPLOY_COMMON_SCRIPT='$common_script' ${{ inputs.runtime_image_argument }}='${{ inputs.image_name }}:${{ inputs.image_tag }}' bash '$wrapper_script'" \
            < /dev/null