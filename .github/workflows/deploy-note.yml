name: Deploy Note

on:
  push:
    branches:
      - sub/note
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-note-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out source and AFFiNE
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure SSH
        env:
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VPS_KNOWN_HOSTS"
          test -n "$VPS_SSH_KEY"
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          eval "$(ssh-agent -s)"
          ssh-add - <<< "$VPS_SSH_KEY"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"

      - name: Transfer AFFiNE Compose files
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          tar -C Streams/DaHang/.docker/selfhost -czf - . | ssh \
            -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            'rm -rf /tmp/affine-selfhost && mkdir -p /tmp/affine-selfhost && tar -xzf - -C /tmp/affine-selfhost'

      - name: Deploy AFFiNE behind Caddy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          ssh \
            -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            'AFFINE_SOURCE_DIR=/tmp/affine-selfhost bash -s' \
            < Streams/DaHangCustom.sh