name: Deploy Note

on:
  ## Do not auto deploy for now
  # push:
  #   branches:
  #     - sub/note
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-note-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: hostkey-server

    steps:
      - name: Check out source and AFFiNE
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resolve AFFiNE deploy dir
        shell: bash
        env:
          VAR_DEPLOY_DIR: ${{ vars.AFFINE_DEPLOY_DIR }}
        run: |
          set -euo pipefail
          if [[ -z "${VAR_DEPLOY_DIR:-}" ]]; then
            echo "::error::Repository variable AFFINE_DEPLOY_DIR is required. Create it under Settings → Secrets and variables → Actions → Variables."
            exit 1
          fi
          if [[ "$VAR_DEPLOY_DIR" != /* ]] || [[ "$VAR_DEPLOY_DIR" == "/" ]]; then
            echo "::error::AFFINE_DEPLOY_DIR must be an absolute path and cannot be '/'."
            exit 1
          fi
          echo "AFFINE_DEPLOY_DIR=$VAR_DEPLOY_DIR" >> "$GITHUB_ENV"

      - name: Configure SSH
        env:
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VPS_KNOWN_HOSTS"
          test -n "$VPS_SSH_KEY"
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          eval "$(ssh-agent -s)"
          ssh-add - <<< "$VPS_SSH_KEY"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"

      - name: Transfer AFFiNE Compose files
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          tar -C Streams/DaHang/.docker/selfhost -czf - . | ssh \
            -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            'rm -rf /tmp/affine-selfhost && mkdir -p /tmp/affine-selfhost && tar -xzf - -C /tmp/affine-selfhost'

      - name: Deploy AFFiNE behind Caddy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          AFFINE_DEPLOY_DIR: ${{ vars.AFFINE_DEPLOY_DIR }}
        run: |
          set -euo pipefail
          ssh \
            -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "AFFINE_SOURCE_DIR=/tmp/affine-selfhost AFFINE_DEPLOY_DIR='$AFFINE_DEPLOY_DIR' bash -s" \
            < Streams/DaHangCustom.sh
