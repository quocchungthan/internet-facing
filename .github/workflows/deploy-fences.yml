name: Deploy Fences

on:
  push:
    branches: ['sub/identity']
    paths:
      - 'Fences/**'
      - 'Fences.Tests/**'
      - '.github/workflows/deploy-fences.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fences-and-backup-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: hostkey-server
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Require identity branch
        run: test "$GITHUB_REF_NAME" = sub/identity

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      - name: Validate artifact configuration
        env:
          SINGLE_UI_TOKEN: ${{ secrets.SINGLE_UI_TOKEN }}
          SINGLE_UI_RUN_ID: ${{ vars.SINGLE_UI_RUN_ID }}
          SINGLE_UI_REVISION: ${{ vars.SINGLE_UI_REVISION }}
        run: |
          set -euo pipefail
          [[ -n "$SINGLE_UI_TOKEN" ]] || { echo "::error::Configure SINGLE_UI_TOKEN with producer Contents:read and Actions:read"; exit 1; }
          [[ "$SINGLE_UI_RUN_ID" =~ ^[1-9][0-9]*$ && "$SINGLE_UI_REVISION" =~ ^[a-f0-9]{40}$ ]] ||
            { echo "::error::Pin SINGLE_UI_RUN_ID and SINGLE_UI_REVISION"; exit 1; }
      - uses: actions/checkout@v4
        with:
          repository: quocchungthan/EMFc-experiments
          ref: ${{ vars.SINGLE_UI_REVISION }}
          token: ${{ secrets.SINGLE_UI_TOKEN }}
          path: single-ui-source
      - name: Import verified Identity frontend
        env:
          GH_TOKEN: ${{ secrets.SINGLE_UI_TOKEN }}
          SINGLE_UI_RUN_ID: ${{ vars.SINGLE_UI_RUN_ID }}
          SINGLE_UI_REVISION: ${{ vars.SINGLE_UI_REVISION }}
        run: node single-ui-source/SingleUI/deployment/artifacts/import-app.mjs identity Fences/frontend
      - name: Test Fences contracts
        run: dotnet test Fences.Tests/Fences.Tests.csproj --configuration Release

      - name: Validate Fences scripts
        run: |
          for script in Fences/scripts/deploy-from-github.sh Fences/scripts/provision-oidc-certificates.sh Fences/scripts/update-fences-env.sh Fences/scripts/deploy-fences.sh deployment/deploy-caddy-service.sh; do
            bash -n "$script" || exit 1
          done

      - name: Build Fences image
        run: docker build --pull --tag "shuneo-fences:${{ github.sha }}" --file Fences/Dockerfile .

      - name: Provision or reconcile, then deploy candidate
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          ACME_EMAIL: ${{ secrets.ACME_EMAIL || vars.ACME_EMAIL }}
          FENCES_GITHUB_CLIENT_ID: ${{ secrets.FENCES_GITHUB_CLIENT_ID }}
          FENCES_GITHUB_CLIENT_SECRET: ${{ secrets.FENCES_GITHUB_CLIENT_SECRET }}
          FENCES_OIDC_CLIENTS_JSON: ${{ secrets.FENCES_OIDC_CLIENTS_JSON }}
          FENCES_DEPLOY_DIR: ${{ vars.FENCES_DEPLOY_DIR }}
          FENCES_BRAND_NAME: ${{ vars.FENCES_BRAND_NAME }}
          FENCES_COOKIE_DOMAIN: ${{ vars.FENCES_COOKIE_DOMAIN }}
          FENCES_OIDC_ISSUER: ${{ vars.FENCES_OIDC_ISSUER }}
          FENCES_PERSISTENT_LOGIN_DAYS: ${{ vars.FENCES_PERSISTENT_LOGIN_DAYS }}
          FENCES_ALLOWED_RETURN_HOST: ${{ vars.FENCES_ALLOWED_RETURN_HOST }}
          FENCES_ALLOWED_CORS_ORIGIN: ${{ vars.FENCES_ALLOWED_CORS_ORIGIN }}
          FENCES_IMAGE: shuneo-fences:${{ github.sha }}
        run: bash Fences/scripts/deploy-from-github.sh