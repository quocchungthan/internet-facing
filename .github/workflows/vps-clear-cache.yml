name: Clear VPS linker/page cache

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type CLEAR_VPS_CACHE to confirm
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: vps-clear-cache-production
  cancel-in-progress: false

jobs:
  clear-cache:
    runs-on: ubuntu-latest
    environment: hostkey-server

    steps:
      - name: Confirm cache clear
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [[ "$CONFIRMATION" != "CLEAR_VPS_CACHE" ]]; then
            echo "::error::Confirmation must exactly equal CLEAR_VPS_CACHE." >&2
            exit 1
          fi

      - name: Refresh linker cache and drop page cache over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077

          ssh_key_file="$(mktemp)"
          known_hosts_file="$(mktemp)"
          cleanup() {
            rm -f -- "$ssh_key_file" "$known_hosts_file"
          }
          trap cleanup EXIT

          for required_secret in VPS_HOST VPS_PORT VPS_USER VPS_SSH_KEY VPS_KNOWN_HOSTS; do
            if [[ -z "${!required_secret}" ]]; then
              echo "::error::Missing required hostkey-server environment value: $required_secret" >&2
              exit 1
            fi
          done
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.:-]+$ ]] || { echo "::error::VPS_HOST has an invalid format." >&2; exit 1; }
          [[ "$VPS_PORT" =~ ^[0-9]+$ ]] || { echo "::error::VPS_PORT must be numeric." >&2; exit 1; }
          [[ "$VPS_USER" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::VPS_USER has an invalid format." >&2; exit 1; }

          printf '%s\n' "$VPS_SSH_KEY" > "$ssh_key_file"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$known_hosts_file"
          chmod 600 "$ssh_key_file" "$known_hosts_file"

          ssh_options=(
            -i "$ssh_key_file"
            -p "$VPS_PORT"
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$known_hosts_file"
            -o GlobalKnownHostsFile=/dev/null
          )
          ssh_target="$VPS_USER@$VPS_HOST"

          echo "Connecting to $VPS_HOST to refresh the dynamic linker cache and drop the page cache..."
          ssh "${ssh_options[@]}" "$ssh_target" 'set -euo pipefail
            if ! command -v sudo >/dev/null 2>&1 || ! sudo -n -l >/dev/null 2>&1; then
              echo "Passwordless sudo is not available for this user; refusing to no-op silently." >&2
              exit 1
            fi

            echo "--- Refreshing dynamic linker cache (ldconfig) ---"
            sudo -n ldconfig
            echo "ldconfig completed."

            echo "--- Syncing filesystem buffers before dropping page cache ---"
            sync

            echo "--- Dropping page cache (vm.drop_caches=3) ---"
            sudo -n sh -c "echo 3 > /proc/sys/vm/drop_caches"
            echo "Page cache dropped."

            echo "--- Post-clear memory summary ---"
            free -h || true'

          echo "VPS cache clear completed successfully. No containers, Caddy config, or Farm deployment state were touched."
