name: Backup Storage Data

on:
  schedule:
    # Run daily at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      retention_days:
        description: 'Backup retention in days (older archives pruned)'
        required: false
        default: '14'

permissions:
  contents: read

concurrency:
  group: backup-storage-production
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    environment: hostkey-server

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VPS_KNOWN_HOSTS"
          test -n "$VPS_SSH_KEY"
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          eval "$(ssh-agent -s)"
          ssh-add - <<< "$VPS_SSH_KEY"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"

      - name: Resolve storage deploy directory
        env:
          VAR_DEPLOY_DIR: ${{ vars.STORAGE_DEPLOY_DIR }}
        run: |
          set -euo pipefail
          if [[ -z "${VAR_DEPLOY_DIR:-}" ]]; then
            echo "::error::Repository variable STORAGE_DEPLOY_DIR is required in hostkey-server."
            exit 1
          fi
          if [[ "$VAR_DEPLOY_DIR" != /* ]] || [[ "$VAR_DEPLOY_DIR" == "/" ]]; then
            echo "::error::STORAGE_DEPLOY_DIR must be an absolute path and cannot be '/'."
            exit 1
          fi
          echo "STORAGE_DEPLOY_DIR=$VAR_DEPLOY_DIR" >> "$GITHUB_ENV"

      - name: Trigger Remote Seafile Backup
        id: run_backup
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          STORAGE_DEPLOY_DIR: ${{ vars.STORAGE_DEPLOY_DIR }}
          RETENTION_DAYS: ${{ github.event.inputs.retention_days || '14' }}
        run: |
          set -euo pipefail
          ssh \
            -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "STORAGE_BASE_DIR='$STORAGE_DEPLOY_DIR' RETENTION_DAYS='$RETENTION_DAYS' bash -s" \
            < Shed/deployment/backup-storage.sh | tee backup_output.log

          backup_file="$(grep '^BACKUP_FILE=' backup_output.log | cut -d'=' -f2-)"
          [[ "$backup_file" == "$STORAGE_DEPLOY_DIR/backups/"* ]] || {
            echo "::error::Backup script returned an invalid archive path." >&2
            exit 1
          }
          echo "Backup archive stays on VPS: $backup_file"
          echo "Copy manually with: scp -P $VPS_PORT $VPS_USER@$VPS_HOST:$backup_file ./"
