name: Diagnose eldervibe.dev full-stack empty-body responses (read-only)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DIAGNOSE_VPS_FULL_STACK to confirm
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: vps-diagnose-full-stack-production
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: hostkey-server

    steps:
      - name: Confirm diagnostic run
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [[ "$CONFIRMATION" != "DIAGNOSE_VPS_FULL_STACK" ]]; then
            echo "::error::Confirmation must exactly equal DIAGNOSE_VPS_FULL_STACK." >&2
            exit 1
          fi

      - name: Run read-only full-stack diagnostics over SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077

          ssh_key_file="$(mktemp)"
          known_hosts_file="$(mktemp)"
          cleanup() {
            rm -f -- "$ssh_key_file" "$known_hosts_file"
          }
          trap cleanup EXIT

          for required_secret in VPS_HOST VPS_PORT VPS_USER VPS_SSH_KEY VPS_KNOWN_HOSTS; do
            if [[ -z "${!required_secret}" ]]; then
              echo "::error::Missing required hostkey-server environment value: $required_secret" >&2
              exit 1
            fi
          done
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.:-]+$ ]] || { echo "::error::VPS_HOST has an invalid format." >&2; exit 1; }
          [[ "$VPS_PORT" =~ ^[0-9]+$ ]] || { echo "::error::VPS_PORT must be numeric." >&2; exit 1; }
          [[ "$VPS_USER" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::VPS_USER has an invalid format." >&2; exit 1; }

          printf '%s\n' "$VPS_SSH_KEY" > "$ssh_key_file"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$known_hosts_file"
          chmod 600 "$ssh_key_file" "$known_hosts_file"

          ssh_options=(
            -i "$ssh_key_file"
            -p "$VPS_PORT"
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$known_hosts_file"
            -o GlobalKnownHostsFile=/dev/null
          )
          ssh_target="$VPS_USER@$VPS_HOST"

          echo "Connecting to $VPS_HOST to run read-only full-stack diagnostics (no system modification)..."
          ssh "${ssh_options[@]}" "$ssh_target" 'set -uo pipefail

            has_passwordless_sudo() {
              command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1
            }

            echo "===== 1. FIREWALL (ufw / iptables) ====="
            if has_passwordless_sudo; then
              echo "--- ufw status verbose ---"
              sudo -n ufw status verbose || echo "(ufw status failed or ufw not installed)"
              echo
              echo "--- iptables -L -n -v (first 100 lines) ---"
              sudo -n iptables -L -n -v 2>&1 | head -100 || echo "(iptables failed)"
            else
              echo "(passwordless sudo not available for this user; skipping firewall checks)"
            fi
            echo

            echo "===== 2. LISTENING PORTS (ss -ltnp) ====="
            ss -ltnp 2>&1 || echo "(ss failed)"
            echo
            echo "--- Filtered for ports 80/443/8080/8081/8180/8181 ---"
            ss -ltnp 2>&1 | grep -E ":(80|443|8080|8081|8180|8181)\b" || echo "(no matches for target ports)"
            echo

            echo "===== 3. DOCKER STATE ====="
            echo "--- docker ps -a (all containers) ---"
            docker ps -a || echo "(docker ps failed)"
            echo
            echo "--- docker inspect eldervibe-farm (key fields) ---"
            docker inspect eldervibe-farm --format "Status: {{.State.Status}} | Restarting: {{.State.Restarting}} | RestartPolicy: {{.HostConfig.RestartPolicy.Name}} (MaxRetry {{.HostConfig.RestartPolicy.MaximumRetryCount}}) | Health: {{if .State.Health}}{{.State.Health.Status}}{{else}}(no healthcheck){{end}} | StartedAt: {{.State.StartedAt}} | Ports: {{.NetworkSettings.Ports}}" 2>&1 || echo "(docker inspect eldervibe-farm failed; container may not exist under this name)"
            echo
            echo "--- docker stats --no-stream (snapshot) ---"
            docker stats --no-stream 2>&1 || echo "(docker stats failed)"
            echo
            echo "--- docker logs --tail 200 eldervibe-farm ---"
            docker logs --tail 200 eldervibe-farm 2>&1 || echo "(docker logs failed; container may not exist under this name)"
            echo

            echo "===== 4. REPEATED FETCH TEST (10x direct container + 10x via Caddy HTTPS) ====="
            farm_port="$(docker port eldervibe-farm 80 2>/dev/null | head -1 | sed -E "s#.*:([0-9]+)\$#\1#")"
            if [[ -z "$farm_port" ]]; then
              echo "(could not detect published port for eldervibe-farm via docker port; skipping direct-container loop)"
            else
              echo "--- Direct container fetch loop via 127.0.0.1:$farm_port (10 iterations) ---"
              for i in $(seq 1 10); do
                echo -n "iteration $i: "
                curl -s -o /dev/null -w "%{http_code} %{size_download} %{time_total}\n" "http://127.0.0.1:${farm_port}/" || echo "curl failed (exit $?)"
              done
            fi
            echo
            echo "--- Caddy HTTPS local fetch loop (Host: eldervibe.dev, 10 iterations) ---"
            for i in $(seq 1 10); do
              echo -n "iteration $i: "
              curl -s -o /dev/null -w "%{http_code} %{size_download} %{time_total}\n" -H "Host: eldervibe.dev" https://127.0.0.1/ -k || echo "curl failed (exit $?)"
            done
            echo

            echo "===== 5. CADDY CONFIG & STATUS ====="
            if has_passwordless_sudo; then
              echo "--- caddy validate --config /etc/caddy/Caddyfile ---"
              sudo -n caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile 2>&1 || echo "(caddy validate failed)"
            else
              echo "(passwordless sudo not available; skipping caddy validate)"
            fi
            echo
            echo "--- Live running config via admin API (localhost:2019/config/) ---"
            if command -v jq >/dev/null 2>&1; then
              curl -s http://localhost:2019/config/ | jq . 2>&1 || echo "(admin API fetch/jq parse failed)"
            else
              curl -s http://localhost:2019/config/ 2>&1 || echo "(admin API fetch failed)"
            fi
            echo
            echo "--- /etc/caddy/Caddyfile ---"
            cat /etc/caddy/Caddyfile 2>&1 || echo "(Caddyfile not readable)"
            echo
            echo "--- ls -la /etc/caddy/sites/ ---"
            ls -la /etc/caddy/sites/ 2>&1 || echo "(sites directory not found)"
            echo
            echo "--- /etc/caddy/sites/eldervibe.dev.caddy ---"
            cat /etc/caddy/sites/eldervibe.dev.caddy 2>&1 || echo "(eldervibe.dev.caddy not found)"
            echo
            echo "--- systemctl status caddy ---"
            systemctl status caddy --no-pager -l 2>&1 || echo "(systemctl status failed)"
            echo
            echo "--- journalctl -u caddy --since \"30 min ago\" (last 200 lines) ---"
            journalctl -u caddy --since "30 min ago" --no-pager 2>&1 | tail -200 || echo "(journalctl failed)"
            echo

            echo "===== 6. CADDY ACCESS LOG EVIDENCE ====="
            access_log_path="$(curl -s http://localhost:2019/config/ 2>/dev/null | grep -o "\"filename\":\"[^\"]*\"" | head -1 | sed -E "s#.*\"filename\":\"([^\"]*)\".*#\1#")"
            if [[ -z "$access_log_path" ]]; then
              echo "(no access log filename found in running Caddy config; access logging may be disabled)"
            else
              echo "Detected access log path: $access_log_path"
              if [[ -r "$access_log_path" ]]; then
                echo "--- tail -100 filtered for eldervibe.dev with status 200 and small/zero bytes_sent ---"
                tail -100 "$access_log_path" | grep "\"host\":\"eldervibe.dev\"" | grep -E "\"status\":200" || echo "(no matching 200-status eldervibe.dev entries in last 100 lines)"
              else
                echo "(access log path not readable by this user)"
              fi
            fi
            echo

            echo "===== 7. SYSTEM SUMMARY ====="
            echo "--- uptime ---"
            uptime || echo "(uptime failed)"
            echo
            echo "--- free -h ---"
            free -h || echo "(free failed)"
            echo
            echo "--- date (for correlation with client-reported timestamps) ---"
            date -u || true
            date || true
            echo

            echo "===== Diagnostics complete. No firewall, Docker, Caddy, or system state was modified. ====="'

          echo "VPS full-stack diagnostic run completed. Review the log above; no configuration, containers, or services were modified."

  sync-preflight:
    # Read-only checklist for the AFFiNE -> Farm sync. Runs after the diagnostics, even when they report problems.
    needs: diagnose
    if: ${{ always() }}
    runs-on: ubuntu-latest
    environment: hostkey-server

    steps:
      - name: Check sync prerequisites over SSH (names and states only, never secret values)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          AFFINE_DEPLOY_DIR: ${{ vars.AFFINE_DEPLOY_DIR }}
          HAS_FENCES_OIDC_CLIENTS_JSON: ${{ secrets.FENCES_OIDC_CLIENTS_JSON != '' }}
          HAS_FENCES_GITHUB_CLIENT_ID: ${{ secrets.FENCES_GITHUB_CLIENT_ID != '' }}
          HAS_FENCES_GITHUB_CLIENT_SECRET: ${{ secrets.FENCES_GITHUB_CLIENT_SECRET != '' }}
          HAS_ACME_EMAIL: ${{ (secrets.ACME_EMAIL || vars.ACME_EMAIL) != '' }}
          HAS_FENCES_OIDC_ISSUER: ${{ vars.FENCES_OIDC_ISSUER != '' }}
          HAS_FENCES_COOKIE_DOMAIN: ${{ vars.FENCES_COOKIE_DOMAIN != '' }}
        run: |
          set -euo pipefail
          umask 077
          ssh_key_file="$(mktemp)"
          known_hosts_file="$(mktemp)"
          trap 'rm -f -- "$ssh_key_file" "$known_hosts_file"' EXIT
          for required in VPS_HOST VPS_PORT VPS_USER VPS_SSH_KEY VPS_KNOWN_HOSTS; do
            [[ -n "${!required}" ]] || { echo "::error::Missing required hostkey-server value: $required" >&2; exit 1; }
          done
          [[ "$VPS_PORT" =~ ^[0-9]+$ ]] || { echo "::error::VPS_PORT must be numeric." >&2; exit 1; }
          if [[ -n "${AFFINE_DEPLOY_DIR:-}" ]] && { [[ "$AFFINE_DEPLOY_DIR" != /* ]] || [[ ! "$AFFINE_DEPLOY_DIR" =~ ^[A-Za-z0-9._/-]+$ ]]; }; then
            echo "::error::AFFINE_DEPLOY_DIR must be an absolute path of safe characters." >&2; exit 1
          fi
          printf '%s\n' "$VPS_SSH_KEY" > "$ssh_key_file"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$known_hosts_file"
          chmod 600 "$ssh_key_file" "$known_hosts_file"

          failures=0
          check() { # check <label> <true|false>
            if [[ "$2" == true ]]; then echo "PASS  $1"; else echo "FAIL  $1"; failures=$((failures + 1)); fi
          }
          echo "== GitHub environment (present / missing) =="
          for name in FENCES_OIDC_CLIENTS_JSON FENCES_GITHUB_CLIENT_ID FENCES_GITHUB_CLIENT_SECRET ACME_EMAIL FENCES_OIDC_ISSUER FENCES_COOKIE_DOMAIN; do
            flag="HAS_$name"; check "$name is set" "${!flag}"
          done
          check "AFFINE_DEPLOY_DIR variable is set" "$([[ -n "${AFFINE_DEPLOY_DIR:-}" ]] && echo true || echo false)"

          echo "== VPS =="
          remote_output="$(ssh -i "$ssh_key_file" -p "$VPS_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts_file" -o GlobalKnownHostsFile=/dev/null \
            "$VPS_USER@$VPS_HOST" "AFFINE_DEPLOY_DIR='${AFFINE_DEPLOY_DIR:-}' bash -s" <<'REMOTE'
          ok() { if "$@" >/dev/null 2>&1; then echo true; else echo false; fi; }
          running() { [[ "$(docker inspect -f '{{.State.Running}}' "$1" 2>/dev/null)" == true ]] && echo true || echo false; }
          out() { echo "$1|$2"; }
          out "Farm DB password file /etc/farm/postgres.password exists" "$(ok test -s /etc/farm/postgres.password)"
          out "Docker network farm-network exists" "$(ok docker network inspect farm-network)"
          out "Container eldervibe-farm-postgres is running" "$(running eldervibe-farm-postgres)"
          out "Container eldervibe-farm is running" "$(running eldervibe-farm)"
          out "Container eldervibe-farm-mind is running" "$(running eldervibe-farm-mind)"
          out "Farm DB accepts connections" "$(ok docker exec eldervibe-farm-postgres pg_isready -p 4554 -U postgres -d aurafarming)"
          tables="$(docker exec eldervibe-farm-postgres psql -p 4554 -U postgres -d aurafarming -tAc "select count(*) from information_schema.tables where table_name in ('PortfolioProjects','PortfolioExperiences','WebsiteMetadata','PlatformBookmarks')" 2>/dev/null | tr -d '[:space:]')"
          out "Farm DB has the AuraFarming and portfolio tables (4 expected)" "$([[ "$tables" == 4 ]] && echo true || echo false)"
          mind="$(docker exec eldervibe-farm-postgres psql -p 4554 -U postgres -d aurafarming -tAc "select count(*) from information_schema.schemata where schema_name='mind'" 2>/dev/null | tr -d '[:space:]')"
          out "Farm DB has the mind schema" "$([[ "$mind" == 1 ]] && echo true || echo false)"
          dir="$AFFINE_DEPLOY_DIR"
          out "AFFiNE deploy dir exists" "$([[ -n "$dir" ]] && ok test -d "$dir" || echo false)"
          out "AFFiNE compose.yml exists" "$([[ -n "$dir" ]] && ok test -f "$dir/compose.yml" || echo false)"
          if [[ -n "$dir" && -f "$dir/compose.yml" ]]; then
            services="$(cd "$dir" && docker compose -f compose.yml ps --services --status running 2>/dev/null)"
            out "AFFiNE compose service postgres is running" "$(grep -qx postgres <<<"$services" && echo true || echo false)"
            out "AFFiNE compose service affine is running" "$(grep -qx affine <<<"$services" && echo true || echo false)"
            found="$(cd "$dir" && docker compose -f compose.yml exec -T postgres sh -c 'psql -U "$POSTGRES_USER" -d postgres -tAc "select 1 from pg_database where datname='"'"'affine'"'"'"' 2>/dev/null | tr -d '"'"'[:space:]'"'"')"
            out "AFFiNE database 'affine' exists" "$([[ "$found" == 1 ]] && echo true || echo false)"
          fi
          out "sync.env exists in the AFFiNE deploy dir" "$([[ -n "$dir" ]] && ok test -f "$dir/sync.env" || echo false)"
          for key in DATABASE_CONNECTION_STRING AFFINE_DATABASE_URL AFFINE_WORKSPACE_ID AFFINE_COLLECTION_ID AFFINE_META_DOC_ID AFFINE_FEEDS_DOC_ID AFFINE_FEEDS_BLOCK_ID AFFINE_PORTFOLIO_COLLECTION_ID AFFINE_GIGS_COLLECTION_ID; do
            # Only the key name and whether it has a non-placeholder value are reported.
            has="false"
            if [[ -n "$dir" && -f "$dir/sync.env" ]]; then
              value="$(grep -E "^$key=" "$dir/sync.env" | head -1 | cut -d= -f2-)"
              [[ -n "$value" && "$value" != *"<"* && "$value" != *REPLACE* ]] && has=true
            fi
            out "sync.env sets $key" "$has"
          done
          state="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' affine-sync 2>/dev/null || true)"
          [[ -n "$state" ]] || state="$(cd "${dir:-/}" && docker compose -f compose.yml -f compose.sync.yml ps -q affine-sync 2>/dev/null | head -1 | xargs -r docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' 2>/dev/null)"
          out "affine-sync container is healthy (optional before the first sync deploy)" "$([[ "$state" == healthy ]] && echo true || echo false)"
          REMOTE
          )"
          while IFS='|' read -r label result; do
            [[ -n "$label" ]] || continue
            check "$label" "$result"
          done <<< "$remote_output"

          echo "== Public endpoints =="
          code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 https://eldervibe.dev/api/portfolio/projects || true)"
          check "GET /api/portfolio/projects returns 200 (got $code)" "$([[ "$code" == 200 ]] && echo true || echo false)"
          code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 -X POST -H 'content-type: application/json' -d '{}' https://eldervibe.dev/mcp || true)"
          check "POST /mcp without a token returns 401 (got $code)" "$([[ "$code" == 401 ]] && echo true || echo false)"

          echo
          if [[ "$failures" -gt 0 ]]; then
            echo "::warning::$failures sync prerequisite(s) not ready. The affine-sync health line only matters after the first sync deploy."
            exit 1
          fi
          echo "All sync prerequisites are ready."
