name: Build and deploy Farm and Farm.Mind

on:
  push:
    branches:
      - main
    paths:
      - Farm/**
      - Farm.Data/**
      - Farm.Auth/**
      - Farm.Mind/**
      - Farm.Microsoft/**
      - Farm.HangingPost/**
      - .github/workflows/build-deploy-farm.yml
      - .github/workflows/reusable-deploy-service.yml
      - .dockerignore
      - deployment/deploy-caddy-service.sh
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-farm-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: hostkey-server

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Restore .NET dependencies
        run: dotnet restore PiggyFarm.slnx

      - uses: actions/checkout@v4
        with:
          repository: quocchungthan/EMFc-experiments
          ref: ${{ vars.SINGLE_UI_REVISION }}
          token: ${{ secrets.SINGLE_UI_TOKEN }}
          path: single-ui-source
      - name: Import verified Farm frontend
        env:
          GH_TOKEN: ${{ secrets.SINGLE_UI_TOKEN }}
          SINGLE_UI_RUN_ID: ${{ vars.SINGLE_UI_RUN_ID }}
          SINGLE_UI_REVISION: ${{ vars.SINGLE_UI_REVISION }}
        run: |
          set -euo pipefail
          [[ "$SINGLE_UI_REVISION" =~ ^[a-f0-9]{40}$ ]] || { echo "::error::Set SINGLE_UI_REVISION"; exit 1; }
          node single-ui-source/SingleUI/deployment/artifacts/import-app.mjs farm Farm/frontend

      - name: Test solution
        run: dotnet test PiggyFarm.slnx --configuration Release --no-restore

      - name: Publish Farm web application
        run: dotnet publish Farm/Farm.csproj --configuration Release --no-restore --output artifacts/farm-web /p:UseAppHost=false

      - name: Build Farm Docker image
        run: docker build --pull --tag eldervibe-farm:${{ github.sha }} --file Farm/Dockerfile .

      - name: Export Farm Docker image
        run: |
          set -euo pipefail
          mkdir -p artifacts/farm-docker-image
          docker save eldervibe-farm:${{ github.sha }} | gzip > artifacts/farm-docker-image/image.tar.gz

      - name: Upload Farm web artifact
        uses: actions/upload-artifact@v4
        with:
          name: farm-web-publish
          path: artifacts/farm-web
          if-no-files-found: error

      - name: Upload Farm Docker image
        uses: actions/upload-artifact@v4
        with:
          name: farm-docker-image
          path: artifacts/farm-docker-image/image.tar.gz
          if-no-files-found: error

  deploy:
    needs: build
    uses: ./.github/workflows/reusable-deploy-service.yml
    with:
      image_name: eldervibe-farm
      image_tag: ${{ github.sha }}
      docker_context: .
      dockerfile: Farm/Dockerfile
      wrapper_path: Farm/scripts/deploy-farm.sh
      deploy_common_script: deployment/deploy-caddy-service.sh
      runtime_image_argument: FARM_IMAGE
      image_artifact: farm-docker-image
    secrets: inherit

  # Farm.Mind (MCP + memory API) shares eldervibe.dev through path routes, so it deploys after Farm,
  # which creates the database password, the key ring and the route directory.
  deploy-mind:
    needs: deploy
    uses: ./.github/workflows/reusable-deploy-service.yml
    with:
      image_name: eldervibe-farm-mind
      image_tag: ${{ github.sha }}
      docker_context: .
      dockerfile: Farm.Mind/Dockerfile
      wrapper_path: Farm.Mind/scripts/deploy-farm-mind.sh
      deploy_common_script: deployment/deploy-caddy-service.sh
      runtime_image_argument: MIND_IMAGE
    secrets: inherit
