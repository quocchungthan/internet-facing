$(hostname) = {env:MADDY_HOSTNAME}
$(primary_domain) = {env:MADDY_DOMAIN}
$(local_domains) = {env:MADDY_DOMAINS}
hostname $(hostname)
tls file /etc/letsencrypt/live/$(hostname)/fullchain.pem /etc/letsencrypt/live/$(hostname)/privkey.pem

auth.pass_table local_authdb {
    table sql_table {
        driver sqlite3
        dsn credentials.db
        table_name passwords
    }
}
storage.imapsql local_mailboxes {
    driver sqlite3
    dsn imapsql.db
}
table.chain local_rewrites {
    optional_step static {
        entry postmaster admin@$(primary_domain)
        entry postmaster@$(primary_domain) admin@$(primary_domain)
        entry abuse@$(primary_domain) admin@$(primary_domain)
    }
}
msgpipeline local_routing {
    destination postmaster $(local_domains) {
        modify {
            replace_rcpt &local_rewrites
        }
        deliver_to &local_mailboxes
    }
    default_destination {
        reject 550 5.1.1 "Unknown recipient"
    }
}
smtp tcp://0.0.0.0:25 {
    limits {
        all rate 10 1s
        all concurrency 10
    }
    dmarc yes
    check {
        require_mx_record
        dkim
        spf
    }
    source $(local_domains) {
        reject 501 5.1.8 "Use authenticated submission"
    }
    default_source {
        destination postmaster $(local_domains) {
            deliver_to &local_routing
        }
        default_destination {
            reject 550 5.7.1 "Relay denied"
        }
    }
}
submission tcp://0.0.0.0:587 {
    limits {
        all rate 60 1m
        all concurrency 10
    }
    auth &local_authdb
    source $(local_domains) {
        check {
            authorize_sender {
                prepare_email &local_rewrites
                user_to_email identity
            }
        }
        destination postmaster $(local_domains) {
            deliver_to &local_routing
        }
        default_destination {
            modify {
                dkim $(local_domains) default
            }
            deliver_to &remote_queue
        }
    }
    default_source {
        reject 501 5.1.8 "Non-local sender"
    }
}
target.remote outbound_delivery {
    limits {
        destination rate 5 1s
        destination concurrency 2
    }
    mx_auth {
        dane
        mtasts {
            cache fs
            fs_dir mtasts_cache/
        }
        local_policy {
            min_tls_level encrypted
            min_mx_level none
        }
    }
}
target.queue remote_queue {
    target &outbound_delivery
    autogenerated_msg_domain $(primary_domain)
    bounce {
        destination postmaster $(local_domains) {
            deliver_to &local_routing
        }
        default_destination {
            reject 550 5.0.0 "Non-local bounce recipient"
        }
    }
}
imap tls://0.0.0.0:993 {
    auth &local_authdb
    storage &local_mailboxes
}
