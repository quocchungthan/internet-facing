name: shuneo-mail
services:
  maddy:
    image: foxcpp/maddy:0.9.5
    restart: unless-stopped
    environment:
      MADDY_HOSTNAME: ${MAIL_HOSTNAME:?Run setup first}
      MADDY_DOMAIN: ${MAIL_DOMAIN:?Run setup first}
      MADDY_DOMAINS: ${MAIL_DOMAINS:-${MAIL_DOMAIN}}
    volumes:
      - ./runtime/mail:/data
      - ./maddy/maddy.conf:/data/maddy.conf:ro
      - ./runtime/letsencrypt:/etc/letsencrypt:ro
    ports:
      - "${BIND_IP:-0.0.0.0}:${SMTP_PORT:-25}:25"
      - "${BIND_IP:-0.0.0.0}:${SUBMISSION_PORT:-587}:587"
      - "${BIND_IP:-0.0.0.0}:${IMAP_PORT:-993}:993"
    networks:
      default:
        aliases:
          - ${MAIL_HOSTNAME}
  web:
    build: ./web
    image: shuneo-webmail:1.0.0
    restart: unless-stopped
    environment:
      MAIL_DOMAIN: ${MAIL_DOMAIN}
      MAIL_DOMAINS: ${MAIL_DOMAINS:-${MAIL_DOMAIN}}
      MAIL_HOSTNAME: ${MAIL_HOSTNAME}
      SECRET_KEY: ${SECRET_KEY:?Run setup first}
      SSL_CERT_FILE: ${SSL_CERT_FILE:-/etc/ssl/certs/ca-certificates.crt}
    volumes:
      - ./runtime/ca:/extra-ca:ro
    depends_on:
      - maddy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:8000"
  certbot:
    image: certbot/certbot:v4.2.0
    profiles: [tools]
    ports:
      - "80:80"
    volumes:
      - ./runtime/letsencrypt:/etc/letsencrypt
      - ./runtime/acme:/var/www/acme
