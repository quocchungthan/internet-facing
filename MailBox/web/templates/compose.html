{% extends 'base.html' %}{% block content %}
<div class="eyebrow">MỘT CUỘC TRÒ CHUYỆN MỚI</div><h1>Soạn thư</h1><form class="editor" method="post"><input type="hidden" name="csrf" value="{{ csrf() }}"><div class="from">Từ <strong>{{ user.email }}</strong></div><label>Đến<input type="email" name="to" placeholder="nguoinhan@example.com" required maxlength="254" value="{{ request.form.get('to', '') }}"></label><label>Tiêu đề<input name="subject" placeholder="Bạn muốn chia sẻ điều gì?" maxlength="200" value="{{ request.form.get('subject', '') }}"></label><label>Nội dung<textarea name="body" placeholder="Viết lời nhắn của bạn…" rows="14" maxlength="100000" required>{{ request.form.get('body', '') }}</textarea></label><div class="editor-footer"><span class="hint">Email văn bản · Một người nhận mỗi lần</span><button class="button">Gửi thư ↗</button></div></form>
{% endblock %}
