{% extends 'base.html' %}{% block content %}
<section class="login-card"><div class="eyebrow">CHÀO MỪNG TRỞ LẠI</div><h1>Thư của bạn.<br>Không gian của bạn.</h1><p class="muted">Đăng nhập để đọc và gửi email trên {{ domain }}.</p>
<form method="post"><input type="hidden" name="csrf" value="{{ csrf() }}"><label>Email<input type="email" name="email" placeholder="shuneo@{{ domain }}" autocomplete="username" required maxlength="254"></label><label>Mật khẩu<input type="password" name="password" autocomplete="current-password" required maxlength="256"></label><button class="button full">Đăng nhập →</button></form><p class="hint">Sử dụng tài khoản được cấp bởi quản trị viên.</p></section>
{% endblock %}
