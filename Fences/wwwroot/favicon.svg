<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#022c22" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Left Document Folio (English / Ingest) -->
  <path d="M16 44V22C16 19.7909 17.7909 18 20 18H24C26.2091 18 28 19.7909 28 22V44" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Right Document Folio (Vietnamese / Output) -->
  <path d="M36 44V22C36 19.7909 37.7909 18 40 18H44C46.2091 18 48 19.7909 48 22V44" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Precision Suspension Arch / The Linguistic Bridge -->
  <path d="M16 34C24 24 40 24 48 34" stroke="url(#beamGrad)" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Central Pulse Node (Translation Nexus) -->
  <circle cx="32" cy="27" r="3" fill="#ffffff"/>
  <circle cx="32" cy="27" r="5" stroke="#a7f3d0" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Foundation Baseline -->
  <line x1="14" y1="44" x2="50" y2="44" stroke="#a7f3d0" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.8"/>
</svg>
